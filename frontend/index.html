<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestión Académica FCAD</title>
    
    <!-- Tailwind CSS para los estilos -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    
    <!-- Configuración de colores institucionales (Queda aquí por ser config de Tailwind CDN) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        institucional: {
                            50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9',
                            600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap)" rel="stylesheet">
    
    <!-- VINCULACIÓN DE TU ARCHIVO CSS SEPARADO -->
    <link rel="stylesheet" href="css/global.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <!-- Contenedor Principal -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <!-- Encabezado del Login -->
        <div class="bg-institucional-700 p-6 text-center">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                <!-- Icono de escudo/universidad SVG -->
                <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-8 w-8 text-institucional-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14v7" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Gestión Académica</h2>
            <p class="text-institucional-100 text-sm mt-1">Facultad de Ciencias de la Administración</p>
        </div>

        <!-- Cuerpo del Formulario -->
        <div class="p-8">
            <!-- Contenedor para mensajes de error/éxito -->
            <div id="messageBox"></div>

            <form id="loginForm" class="space-y-6">
                <!-- Input Usuario -->
                <div>
                    <label for="nombre_usuario" class="block text-sm font-medium text-slate-700 mb-1">Nombre de Usuario</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" /></svg>
                        </div>
                        <input type="text" id="nombre_usuario" name="nombre_usuario" required class="pl-10 block w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-institucional-500 focus:border-institucional-500 text-sm transition-colors" placeholder="Ej: jperez">
                    </div>
                </div>

                <!-- Input Contraseña -->
                <div>
                    <label for="contrasenia" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)" class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" /></svg>
                        </div>
                        <input type="password" id="contrasenia" name="contrasenia" required class="pl-10 block w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-institucional-500 focus:border-institucional-500 text-sm transition-colors" placeholder="••••••••">
                    </div>
                </div>

                <!-- Botón Submit -->
                <button type="submit" id="loginBtn" class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-institucional-600 hover:bg-institucional-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-institucional-500 transition-colors">
                    Ingresar
                </button>
            </form>
        </div>
        
        <!-- Footer de la tarjeta -->
        <div class="bg-slate-50 px-8 py-4 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500 font-medium">Trabajo Final Integrador • Programación IV • UNER</p>
        </div>
    </div>

    <!-- VINCULACIÓN DE TU ARCHIVO JAVASCRIPT SEPARADO -->
    <script src="js/login.js"></script>
</body>
</html>
