<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos - Gestión Académica FCAD</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Config -->
    <script src="js/tailwind-config.js"></script>

    <!-- CSS global -->
    <link rel="stylesheet" href="css/global.css">
</head>

<body class="min-h-screen flex flex-col relative overflow-hidden">

    <!-- FONDO -->
    <div class="fixed inset-0 z-0">
        <div class="absolute inset-0 bg-institucional-50"></div>

        <div
            class="absolute inset-0 bg-[url('imgs/logoFCAD.svg')] bg-cover bg-center bg-no-repeat opacity-60 blur-3xl scale-125">
        </div>
    </div>

    <!-- HEADER -->
    <header class="relative z-10 bg-institucional-600/90 backdrop-blur-md text-white px-6 py-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl md:text-2xl font-bold tracking-wide">
            Cursos Disponibles
        </h1>

        <button class="bg-white/90 text-institucional-600 px-4 py-2 rounded-xl font-semibold 
            hover:bg-white transition shadow-md hover:shadow-lg">
            Cerrar sesión
        </button>
    </header>

    <!-- CONTENEDOR -->
    <main class="relative z-10 flex-grow p-6 md:p-10 max-w-6xl mx-auto w-full">

        <div id="cursosContainer" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
            <!-- Se renderiza con JS -->
        </div>

    </main>

    <!-- JS -->
    <script src="../js/cursos.js" defer></script>

</body>

</html>
