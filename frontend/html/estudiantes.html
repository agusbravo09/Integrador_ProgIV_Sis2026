<!-- html/estudiantes.html -->
<!-- NOTA: No hay html, ni head, ni body, ni sidebar. Solo el contenido central. -->
<div class="animate-fade-in flex flex-col h-full">

    <!-- Topbar -->
    <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center rounded-2xl mb-8 border border-slate-200">
        <h1 class="text-2xl font-bold text-slate-800">Gestión de Estudiantes</h1>
        <!-- Botón Add (BREAD) -->
        <button onclick="toggleModal('estudianteModal', 'Nuevo Estudiante')" class="bg-institucional-600 hover:bg-institucional-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center shadow-sm transition-colors">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            Nuevo Estudiante
        </button>
    </header>

    <!-- Body con scroll -->
    <div class="flex-1 pb-8">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            
            <!-- Buscadores / Filtros (BREAD - Browse) -->
            <div class="p-4 border-b border-slate-200 bg-slate-50 flex flex-col md:flex-row gap-4 justify-between items-center">
                <div class="flex flex-1 gap-4 w-full md:w-auto">
                    <div class="relative flex-1 max-w-md">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg>
                        </div>
                        <input type="text" placeholder="Buscar por Apellido o Nombre..." class="pl-10 w-full rounded-lg border border-slate-300 px-4 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                    </div>
                    <input type="text" placeholder="Documento" class="w-32 rounded-lg border border-slate-300 px-4 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-slate-500">Mostrar:</span>
                    <select class="rounded-lg border border-slate-300 px-2 py-1 text-sm focus:ring-institucional-500 focus:border-institucional-500 bg-white">
                        <option>10</option>
                        <option>25</option>
                        <option>50</option>
                    </select>
                </div>
            </div>

            <!-- Tabla de Estudiantes (BREAD - Read/Browse) -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="px-6 py-3 font-medium">Documento</th>
                            <th class="px-6 py-3 font-medium">Estudiante</th>
                            <th class="px-6 py-3 font-medium">Email</th>
                            <th class="px-6 py-3 font-medium text-center">Estado</th>
                            <th class="px-6 py-3 font-medium text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 text-sm">
                        <!-- Fila 1 -->
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 text-slate-600">35.123.456</td>
                            <td class="px-6 py-4">
                                <div class="font-medium text-slate-800">Perez, Juan Ignacio</div>
                                <div class="text-xs text-slate-500">Nac: 15/04/1990</div>
                            </td>
                            <td class="px-6 py-4 text-slate-600">jperez@alumno.uner.edu.ar</td>
                            <td class="px-6 py-4 text-center">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
                                    Activo
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <!-- Edit (BREAD) -->
                                <button onclick="toggleModal('estudianteModal', 'Editar Estudiante')" class="text-institucional-600 hover:text-institucional-900" title="Editar">
                                    <svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                </button>
                                <!-- Delete (BREAD) -->
                                <button onclick="confirmarEliminar()" class="text-red-600 hover:text-red-900" title="Dar de baja">
                                    <svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginación de Resultados -->
            <div class="px-6 py-4 border-t border-slate-200 bg-white flex items-center justify-between">
                <div class="text-sm text-slate-500">
                    Mostrando <span class="font-medium text-slate-700">1</span> a <span class="font-medium text-slate-700">2</span> de <span class="font-medium text-slate-700">120</span> estudiantes
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Agregar/Editar Estudiante -->
    <div id="estudianteModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden">
            <!-- Modal Header -->
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Nuevo Estudiante</h3>
                <button onclick="toggleModal('estudianteModal')" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <!-- Modal Body -->
            <div class="p-6">
                <form id="estudianteForm" class="space-y-4">
                    <input type="hidden" id="id_estudiante">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Documento *</label>
                            <input type="text" id="documento" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Fecha de Nacimiento</label>
                            <input type="date" id="fecha_nacimiento" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Apellidos *</label>
                            <input type="text" id="apellido" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Nombres *</label>
                            <input type="text" id="nombres" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                        <input type="email" id="email" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                    </div>
                    <div class="flex items-center mt-4">
                        <input type="checkbox" id="activo" checked class="h-4 w-4 text-institucional-600 focus:ring-institucional-500 border-slate-300 rounded">
                        <label for="activo" class="ml-2 block text-sm text-slate-700">Estudiante Activo</label>
                    </div>
                </form>
            </div>
            <!-- Modal Footer -->
            <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex justify-end space-x-3">
                <button type="button" onclick="toggleModal('estudianteModal')" class="bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 px-4 py-2 rounded-lg text-sm font-medium transition-colors">Cancelar</button>
                <button type="button" onclick="guardarEstudiante()" class="bg-institucional-600 hover:bg-institucional-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">Guardar Datos</button>
            </div>
        </div>
    </div>
</div>
