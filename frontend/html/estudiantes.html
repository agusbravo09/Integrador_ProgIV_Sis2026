<div class="animate-fade-in flex flex-col h-full">


    <!-- Header principal: en móvil se apila verticalmente, en desktop queda en fila -->
    <header
        class="bg-white shadow-sm px-4 sm:px-8 py-4 sm:py-5 flex flex-col sm:flex-row gap-3 sm:gap-0 justify-between items-start sm:items-center rounded-2xl mb-4 sm:mb-8 border border-slate-200">
        <div>
            <h1 class="text-xl sm:text-2xl font-bold text-slate-800">Gestión de Estudiantes</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Administración del padrón de estudiantes</p>
        </div>

        <button onclick="window.toggleModalEstudiante('estudianteModal', 'Nuevo Estudiante')"
            class="bg-institucional-600 hover:bg-institucional-700 text-white px-4 py-2 rounded-lg text-xs sm:text-sm font-medium flex items-center shadow-sm transition-colors w-full sm:w-auto justify-center">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6">
                </path>
            </svg>
            Nuevo Estudiante
        </button>
    </header>


    <div class="flex-1 pb-8">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">


            <!-- Filtros: se apilan en móvil -->
            <div
                class="p-4 border-b border-slate-200 bg-slate-50 flex flex-col sm:flex-row gap-3 sm:gap-4 justify-between items-stretch sm:items-center">
                <div class="flex flex-col sm:flex-row flex-1 gap-3 sm:gap-4">
                    <div class="relative flex-1 sm:max-w-md">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                                    clip-rule="evenodd" />
                            </svg>
                        </div>
                        <input type="text" id="buscadorEstudiantes" oninput="window.filtrarEstudiantes()"
                            placeholder="Buscar por documento, apellido o nombre..."
                            class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg focus:ring-institucional-500 focus:border-institucional-500 text-sm">
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-sm text-slate-500">Mostrar:</span>
                    <select title="Cantidad de registros por página"
                        class="rounded-lg border border-slate-300 px-2 py-1 text-sm focus:ring-institucional-500 focus:border-institucional-500 bg-white">
                        <option>10</option>
                        <option>25</option>
                        <option>50</option>
                    </select>
                </div>
            </div>


            <div class="overflow-x-auto">
                <!-- Tabla responsive -->
                <table class="responsive-table w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="px-6 py-3 font-medium">Documento</th>
                            <th class="px-6 py-3 font-medium">Estudiante</th>
                            <th class="px-6 py-3 font-medium">Fecha Nac.</th> <!-- NUEVA COLUMNA -->
                            <th class="px-6 py-3 font-medium">Email</th>
                            <th class="px-6 py-3 font-medium text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaEstudiantes" class="divide-y divide-slate-200 text-sm">


                    </tbody>
                </table>
            </div>


            <!-- Paginación -->
            <div class="px-4 sm:px-6 py-4 border-t border-slate-200 bg-white flex items-center justify-between">
                <div class="text-sm text-slate-500" id="paginacionInfoEstudiantes">
                    Mostrando <span class="font-medium text-slate-700">0</span> estudiantes
                </div>
                <div class="flex gap-2">
                    <button id="btnPrevPageEstudiantes" onclick="cambiarPaginaEstudiantes(-1)"
                        class="px-3 py-1 border border-slate-300 rounded text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed text-sm">Anterior</button>
                    <button id="btnNextPageEstudiantes" onclick="cambiarPaginaEstudiantes(1)"
                        class="px-3 py-1 border border-slate-300 rounded text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed text-sm">Siguiente</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal: en móvil ocupa toda la pantalla, en desktop se centra con max-width -->
    <div id="estudianteModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-2 sm:p-6">
        <div
            class="bg-white w-full max-w-2xl rounded-xl sm:rounded-2xl shadow-2xl overflow-hidden max-h-[95vh] sm:max-h-none flex flex-col">

            <!-- Header del modal -->
            <div
                class="bg-slate-50 px-4 sm:px-6 py-3 sm:py-4 border-b border-slate-200 flex justify-between items-center flex-shrink-0">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Nuevo Estudiante</h3>
                <button onclick="window.toggleModalEstudiante('estudianteModal')"
                    class="text-slate-400 hover:text-slate-600" aria-label="Cerrar modal">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <!-- Cuerpo del modal con scroll en mobile -->
            <div class="p-4 sm:p-6 overflow-y-auto flex-1">
                <form id="estudianteForm" class="space-y-4">
                    <input type="hidden" id="id_estudiante">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="documento" class="block text-sm font-medium text-slate-700 mb-1">Documento
                                *</label>
                            <input type="text" id="documento" required
                                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                        </div>
                        <div>
                            <label for="fecha_nacimiento" class="block text-sm font-medium text-slate-700 mb-1">Fecha de
                                Nacimiento</label>
                            <input type="date" id="fecha_nacimiento"
                                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                            <p id="error_fecha" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="apellido" class="block text-sm font-medium text-slate-700 mb-1">Apellidos
                                *</label>
                            <input type="text" id="apellido" required
                                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                        </div>
                        <div>
                            <label for="nombres" class="block text-sm font-medium text-slate-700 mb-1">Nombres *</label>
                            <input type="text" id="nombres" required
                                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                        </div>
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Correo
                            Electrónico *</label>
                        <input type="email" id="email" required
                            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                    </div>

                    <p id="error_general" class="text-red-500 text-sm font-medium mt-2 hidden text-center"></p>
                </form>
            </div>

            <!-- Footer del modal: en mobile los botones se apilan -->
            <div
                class="bg-slate-50 px-4 sm:px-6 py-3 sm:py-4 border-t border-slate-200 flex flex-col-reverse sm:flex-row justify-end gap-2 sm:gap-3 flex-shrink-0">
                <button type="button" onclick="window.toggleModalEstudiante('estudianteModal')"
                    class="px-4 py-2 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-50 transition text-sm">Cancelar</button>
                <button type="button" onclick="guardarEstudiante()"
                    class="px-4 py-2 rounded-lg bg-institucional-600 hover:bg-institucional-700 text-white transition text-sm shadow-sm">Guardar
                    Datos</button>
            </div>
        </div>
    </div>
</div>
