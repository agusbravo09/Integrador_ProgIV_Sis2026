
<div class="animate-fade-in flex flex-col h-full">

    
    <header class="bg-white shadow-sm px-8 py-4 flex justify-between items-center rounded-2xl mb-8 border border-slate-200">
        <h1 class="text-2xl font-bold text-slate-800">Inscripciones</h1>
        
        <button onclick="toggleModal('inscripcionModal')" class="bg-institucional-600 hover:bg-institucional-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center shadow-sm transition-colors">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
            Nueva Inscripción
        </button>
    </header>

    
    <div class="flex-1 pb-8">
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            
            
            <div class="p-4 border-b border-slate-200 bg-slate-50 flex flex-col md:flex-row gap-4 justify-between items-center">
                <div class="flex flex-1 gap-4 w-full md:w-auto">
                    <select class="rounded-lg border border-slate-300 px-4 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500 bg-white">
                        <option value="">Filtrar por Curso...</option>
                        <option value="1">Programación Java Avanzada</option>
                        <option value="2">Bases de Datos con MySQL</option>
                    </select>
                    <div class="relative flex-1 max-w-xs">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg>
                        </div>
                        <input type="text" placeholder="Buscar alumno..." class="pl-10 w-full rounded-lg border border-slate-300 px-4 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500">
                    </div>
                </div>
            </div>

            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="px-6 py-3 font-medium">Nº Ins.</th>
                            <th class="px-6 py-3 font-medium">Fecha/Hora</th>
                            <th class="px-6 py-3 font-medium">Estudiante</th>
                            <th class="px-6 py-3 font-medium">Curso</th>
                            <th class="px-6 py-3 font-medium text-center">Estado</th>
                            <th class="px-6 py-3 font-medium text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200 text-sm">
                        
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 text-slate-500 font-mono">#1042</td>
                            <td class="px-6 py-4 text-slate-600">10/05/2026 14:30</td>
                            <td class="px-6 py-4">
                                <div class="font-medium text-slate-800">Perez, Juan Ignacio</div>
                                <div class="text-xs text-slate-500">35.123.456</div>
                            </td>
                            <td class="px-6 py-4 text-slate-800 font-medium">Programación Java Avanzada</td>
                            <td class="px-6 py-4 text-center">
                                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">Confirmada</span>
                            </td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <button onclick="imprimirDiplomaIndividual('Perez, Juan Ignacio', 'Programación Java Avanzada')" class="text-amber-600 hover:text-amber-800 bg-amber-50 p-1.5 rounded" title="Generar Diploma">
                                    <svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 14l9-5-9-5-9 5 9 5z"></path><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14v7"></path></svg>
                                </button>
                                <button class="text-red-600 hover:text-red-900 bg-red-50 p-1.5 rounded" title="Anular Inscripción">
                                    <svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            
            <div class="px-6 py-4 border-t border-slate-200 bg-white flex items-center justify-between">
                <div class="text-sm text-slate-500">
                    Mostrando <span class="font-medium text-slate-700">1</span> a <span class="font-medium text-slate-700">1</span> de <span class="font-medium text-slate-700">1</span> inscripciones
                </div>
            </div>
        </div>
    </div>

    
    <div id="inscripcionModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800">Registrar Inscripción</h3>
                <button onclick="toggleModal('inscripcionModal')" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6">
                
                <div id="errorBox" class="hidden mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200"></div>

                <form id="inscripcionForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Seleccionar Estudiante *</label>
                        <select id="id_estudiante" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500 bg-white">
                            <option value="">-- Seleccione Alumno --</option>
                            <option value="1">Perez, Juan Ignacio (35.123.456)</option>
                            <option value="2">Gomez, Maria Laura (38.987.654)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Seleccionar Curso *</label>
                        <select id="id_curso" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:ring-institucional-500 focus:border-institucional-500 bg-white">
                            <option value="">-- Seleccione Curso --</option>
                            <option value="1" data-estado="abierto">Programación Java Avanzada (Cupo: 24/30)</option>
                            <option value="2" data-estado="lleno">Bases de Datos con MySQL (Cupo: 40/40) - LLENO</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="bg-slate-50 px-6 py-4 border-t border-slate-200 flex justify-end space-x-3">
                <button type="button" onclick="toggleModal('inscripcionModal')" class="bg-white text-slate-700 border border-slate-300 hover:bg-slate-50 px-4 py-2 rounded-lg text-sm font-medium transition-colors">Cancelar</button>
                <button type="button" onclick="validarYGuardarInscripcion()" class="bg-institucional-600 hover:bg-institucional-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">Inscribir Alumno</button>
            </div>
        </div>
    </div>
</div>
