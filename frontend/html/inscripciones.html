<div>

    <header
        class="bg-white shadow-sm px-8 py-4 flex justify-between items-center rounded-2xl mb-8 border border-slate-200">
        <h1 class="text-2xl font-bold text-slate-800">Inscripciones</h1>

        <button
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center shadow-sm transition-colors">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6">
                </path>
            </svg>
            Nueva Inscripción
        </button>
    </header>

    <div class="pb-8">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">

            <div class="p-4 border-b border-slate-200 bg-slate-50 flex gap-4 justify-between items-center">
                <div class="flex gap-4 w-full">
                    <select title="Filtrar por curso"
                        class="rounded-lg border border-slate-300 px-4 py-2 text-sm bg-white">
                        <option value="">Filtrar por Curso...</option>
                        <option value="1">Programación Java Avanzada</option>
                        <option value="2">Bases de Datos con MySQL</option>
                    </select>
                    <div class="relative flex-1 max-w-xs">
                        <input type="text" placeholder="Buscar alumno..."
                            class="w-full rounded-lg border border-slate-300 px-4 py-2 text-sm">
                    </div>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr
                            class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="px-6 py-3 font-medium">Nº Ins.</th>
                            <th class="px-6 py-3 font-medium">Fecha/Hora</th>
                            <th class="px-6 py-3 font-medium">Estudiante</th>
                            <th class="px-6 py-3 font-medium">Curso</th>
                            <th class="px-6 py-3 font-medium text-center">Estado</th>
                            <th class="px-6 py-3 font-medium text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-inscripciones-body" class="divide-y divide-slate-200 text-sm">
                        <!-- Las filas se generan desde inscripciones.js -->
                    </tbody>
                </table>
            </div>

            <div class="px-6 py-4 border-t border-slate-200 bg-white flex items-center justify-between">
                <div class="text-sm text-slate-500" id="info-paginacion"></div>
                <div class="flex gap-2">
                    <button id="btn-prev-page" class="px-3 py-1 border border-slate-300 rounded text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">Anterior</button>
                    <button id="btn-next-page" class="px-3 py-1 border border-slate-300 rounded text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed">Siguiente</button>
                </div>
            </div>
        </div>
    </div>

    <div
        class="max-w-3xl mx-auto mt-10 bg-white border-2 border-slate-300 rounded-xl p-5">

        <div class="border-b border-slate-200 pb-4 mb-5">
            <h2 class="text-xl font-bold m-0">Nueva Inscripción (Modo Prueba)</h2>
            <p class="text-sm text-slate-500 mt-1">Si ves esto completo hasta los botones de abajo,
                el problema era el CSS.</p>
        </div>

        <form id="inscripcionForm">

            <div class="mb-6">
                <h3 class="font-bold border-b border-slate-200 pb-1 mb-4">
                    Datos del Alumno</h3>
                <div class="block mb-4">
                    <label class="block mb-1">Alumno *</label>
                    <select title="Seleccionar alumno" class="w-full p-2 border border-slate-300 rounded-md">
                        <option value="">Seleccione un alumno</option>
                    </select>
                </div>
                <div class="block">
                    <label class="block mb-1">Legajo *</label>
                    <input type="text" placeholder="Ingrese legajo" title="Legajo"
                        class="w-full p-2 border border-slate-300 rounded-md">
                </div>
            </div>

            <div class="mb-6">
                <h3 class="font-bold border-b border-slate-200 pb-1 mb-4">
                    Datos Académicos</h3>
                <div class="block mb-4">
                    <label class="block mb-1">Carrera *</label>
                    <select title="Seleccionar carrera" class="w-full p-2 border border-slate-300 rounded-md">
                        <option value="">Seleccione una carrera</option>
                    </select>
                </div>
                <div class="block mb-4">
                    <label class="block mb-1">Curso *</label>
                    <select title="Seleccionar curso" class="w-full p-2 border border-slate-300 rounded-md">
                        <option value="">Seleccione un curso</option>
                    </select>
                </div>
                <div class="block mb-4">
                    <label class="block mb-1">Comisión *</label>
                    <select title="Seleccionar comisión" class="w-full p-2 border border-slate-300 rounded-md">
                        <option value="">Seleccione una comisión</option>
                    </select>
                </div>
                <div class="block">
                    <label class="block mb-1">Cuatrimestre *</label>
                    <select title="Seleccionar cuatrimestre" class="w-full p-2 border border-slate-300 rounded-md">
                        <option value="">Seleccione cuatrimestre</option>
                    </select>
                </div>
            </div>

            <div class="mb-6">
                <h3 class="font-bold border-b border-slate-200 pb-1 mb-4">
                    Datos de Inscripción</h3>
                <div class="block mb-4">
                    <label class="block mb-1">Año académico *</label>
                    <input type="text" placeholder="2026" title="Año académico"
                        class="w-full p-2 border border-slate-300 rounded-md">
                </div>
                <div class="block mb-4">
                    <label class="block mb-1">Fecha de inscripción *</label>
                    <input type="date" title="Fecha de inscripción" class="w-full p-2 border border-slate-300 rounded-md">
                </div>
                <div class="block">
                    <label class="block mb-1">Estado de inscripción *</label>
                    <select title="Estado de inscripción" class="w-full p-2 border border-slate-300 rounded-md">
                        <option value="Inscripto">Inscripto</option>
                    </select>
                </div>
            </div>

            <div class="mb-6">
                <h3 class="font-bold border-b border-slate-200 pb-1 mb-4">
                    Opciones Adicionales</h3>
                <div>
                    <input type="checkbox" id="materias_promocionales" title="Materias promocionales">
                    <label for="materias_promocionales">Materias promocionales</label>
                </div>
            </div>

            <div class="mb-6">
                <label class="block mb-1">Observaciones</label>
                <textarea rows="3" placeholder="Ingrese observaciones..." title="Observaciones"
                    class="w-full p-2 border border-slate-300 rounded-md"></textarea>
            </div>

        </form>

        <div class="border-t border-slate-200 pt-5 block space-x-2">
            <button type="button"
                class="px-5 py-2.5 bg-blue-600 text-white rounded-md cursor-pointer hover:bg-blue-700 transition-colors">Guardar
                inscripción</button>
            <button type="button"
                class="px-5 py-2.5 bg-white text-slate-800 border border-slate-300 rounded-md cursor-pointer hover:bg-slate-50 transition-colors">Cancelar</button>
            <button type="button"
                class="px-5 py-2.5 bg-transparent text-slate-600 cursor-pointer hover:text-slate-800 transition-colors">Limpiar
                formulario</button>
        </div>

    </div>
</div>
